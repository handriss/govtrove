<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — GovTrove</title>
    <meta name="description" content="Get in touch with the GovTrove team. Questions about searching federal contract opportunities or using GovTrove? We'd love to hear from you.">
    <link rel="canonical" href="https://govtrove.com/contact.html">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="/theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-primary);
            background: var(--bg-page);
        }
        a { color: var(--link-color); text-decoration: none; }
        a:hover { color: var(--link-hover); }

        .nav {
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
        }
        .container { max-width: 800px; margin: 0 auto; padding: 0 1.5rem; }
        .nav-inner { display: flex; align-items: center; justify-content: space-between; }
        .nav-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .nav-logo svg { color: var(--link-color); }
        .nav-back { font-size: 0.875rem; color: var(--text-secondary); }
        .nav-back:hover { color: var(--text-primary); }

        .content { padding: 3rem 0 4rem; }

        h1 {
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 0.9375rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .form-group { margin-bottom: 1.25rem; }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--label-text);
            margin-bottom: 0.375rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.625rem 0.75rem;
            font-family: inherit;
            font-size: 0.9375rem;
            color: var(--text-primary);
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 0.5rem;
            transition: border-color 0.15s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--link-color);
        }
        select { cursor: pointer; }
        select option { background: var(--select-option-bg); color: var(--text-primary); }
        textarea { resize: vertical; min-height: 120px; }

        .char-count {
            font-size: 0.75rem;
            color: var(--char-count-text);
            text-align: right;
            margin-top: 0.25rem;
        }
        .char-count.near-limit { color: #f59e0b; }
        .char-count.at-limit { color: #ef4444; }

        .hp { position: absolute; left: -9999px; }

        .submit-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-family: inherit;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #fff;
            background: var(--link-color);
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        .submit-btn:hover { background: var(--link-hover); }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 1rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.9375rem;
            margin-bottom: 1.5rem;
        }
        .alert-success {
            background: var(--alert-success-bg);
            border: 1px solid var(--alert-success-border);
            color: var(--alert-success-text);
        }
        .alert-error {
            background: var(--alert-error-bg);
            border: 1px solid var(--alert-error-border);
            color: var(--alert-error-text);
        }

        .footer {
            padding: 2rem 0;
            border-top: 1px solid var(--border-subtle);
            font-size: 0.875rem;
            color: var(--footer-text);
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="container nav-inner">
            <a href="/" class="nav-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                GovTrove
            </a>
            <div style="display:flex;align-items:center;gap:1.5rem;">
                <a href="/blog/" class="nav-back">Blog</a>
                <a href="/" class="nav-back">&larr; Back to Home</a>
            </div>
        </div>
    </nav>

    <main class="content">
        <div class="container">
            <h1>Contact Us</h1>
            <p class="subtitle">Have a question, feedback, or partnership inquiry? We'd love to hear from you.</p>

            <div id="success-msg" class="alert alert-success" style="display:none;">
                Thank you for reaching out! We'll get back to you as soon as possible.
            </div>
            <div id="error-msg" class="alert alert-error" style="display:none;"></div>

            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required maxlength="200" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required maxlength="320" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject" required>
                        <option value="">Select a topic</option>
                        <option value="General">General Inquiry</option>
                        <option value="Support">Support</option>
                        <option value="Feedback">Feedback</option>
                        <option value="Bug Report">Report a Problem</option>
                        <option value="Partnership">Partnership</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required maxlength="5000"></textarea>
                    <div class="char-count"><span id="char-current">0</span> / 5,000</div>
                </div>

                <div class="hp" aria-hidden="true">
                    <label for="website">Website</label>
                    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">Send Message</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            &copy; 2026 GovTrove. All rights reserved.
        </div>
    </footer>

    <script>
        var form = document.getElementById('contact-form');
        var btn = document.getElementById('submit-btn');
        var successMsg = document.getElementById('success-msg');
        var errorMsg = document.getElementById('error-msg');
        var messageEl = document.getElementById('message');
        var charCurrent = document.getElementById('char-current');
        var subjectEl = document.getElementById('subject');

        // Pre-select subject from query param (e.g. ?subject=bug)
        var params = new URLSearchParams(window.location.search);
        if (params.get('subject') === 'bug') {
            subjectEl.value = 'Bug Report';
        }

        messageEl.addEventListener('input', function() {
            var len = this.value.length;
            charCurrent.textContent = len.toLocaleString();
            var counter = this.nextElementSibling;
            counter.className = 'char-count' + (len >= 5000 ? ' at-limit' : len >= 4500 ? ' near-limit' : '');
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Sending...';

            var message = document.getElementById('message').value.trim();
            var referrer = document.referrer;
            if (subjectEl.value === 'Bug Report' && referrer) {
                message = 'Page: ' + referrer + '\n\n' + message;
            }

            var data = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                subject: subjectEl.value,
                message: message,
                website: document.getElementById('website').value
            };

            fetch('https://api.govtrove.com/api/contact/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(function(res) {
                if (!res.ok) {
                    return res.text().then(function(t) { throw new Error(t || 'Something went wrong'); });
                }
                form.style.display = 'none';
                successMsg.style.display = 'block';
            })
            .catch(function(err) {
                errorMsg.textContent = err.message || 'Failed to send message. Please try again.';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Send Message';
            });
        });
    </script>

</body>
</html>
