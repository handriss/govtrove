<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — GovTrove</title>
    <meta name="description" content="Get in touch with the GovTrove team">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            line-height: 1.7;
            color: #f1f5f9;
            background: #0a0f1a;
        }
        a { color: #3b82f6; text-decoration: none; }
        a:hover { color: #2563eb; }

        .nav {
            padding: 1rem 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(12px);
        }
        .container { max-width: 800px; margin: 0 auto; padding: 0 1.5rem; }
        .nav-inner { display: flex; align-items: center; justify-content: space-between; }
        .nav-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .nav-logo svg { color: #3b82f6; }
        .nav-back { font-size: 0.875rem; color: #94a3b8; }
        .nav-back:hover { color: #f1f5f9; }

        .content { padding: 3rem 0 4rem; }

        h1 {
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 0.9375rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .form-group { margin-bottom: 1.25rem; }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 0.375rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.625rem 0.75rem;
            font-family: inherit;
            font-size: 0.9375rem;
            color: #f1f5f9;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 0.5rem;
            transition: border-color 0.15s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
        select { cursor: pointer; }
        select option { background: #0f172a; color: #f1f5f9; }
        textarea { resize: vertical; min-height: 120px; }

        .char-count {
            font-size: 0.75rem;
            color: #64748b;
            text-align: right;
            margin-top: 0.25rem;
        }
        .char-count.near-limit { color: #f59e0b; }
        .char-count.at-limit { color: #ef4444; }

        .hp { position: absolute; left: -9999px; }

        .submit-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-family: inherit;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #fff;
            background: #3b82f6;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        .submit-btn:hover { background: #2563eb; }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 1rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.9375rem;
            margin-bottom: 1.5rem;
        }
        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: #4ade80;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
        }

        .footer {
            padding: 2rem 0;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            font-size: 0.875rem;
            color: #64748b;
            text-align: center;
        }
    </style>
    <script>if(!localStorage.getItem('govtrove_notrack'))document.write('<script src="https://cdn.counter.dev/script.js" data-id="65dc1175-5654-4e33-b21c-a0886ea068d3" data-utcoffset="1"><\/script>')</script>
</head>
<body>
    <nav class="nav">
        <div class="container nav-inner">
            <a href="/" class="nav-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                GovTrove
            </a>
            <div style="display:flex;align-items:center;gap:1.5rem;">
                <a href="/blog/" class="nav-back">Blog</a>
                <a href="/" class="nav-back">&larr; Back to Home</a>
            </div>
        </div>
    </nav>

    <main class="content">
        <div class="container">
            <h1>Contact Us</h1>
            <p class="subtitle">Have a question, feedback, or partnership inquiry? We'd love to hear from you.</p>

            <div id="success-msg" class="alert alert-success" style="display:none;">
                Thank you for reaching out! We'll get back to you as soon as possible.
            </div>
            <div id="error-msg" class="alert alert-error" style="display:none;"></div>

            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required maxlength="200" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required maxlength="320" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject" required>
                        <option value="">Select a topic</option>
                        <option value="General">General Inquiry</option>
                        <option value="Support">Support</option>
                        <option value="Feedback">Feedback</option>
                        <option value="Partnership">Partnership</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required maxlength="5000"></textarea>
                    <div class="char-count"><span id="char-current">0</span> / 5,000</div>
                </div>

                <div class="hp" aria-hidden="true">
                    <label for="website">Website</label>
                    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">Send Message</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            &copy; 2026 GovTrove. All rights reserved.
        </div>
    </footer>

    <script>
        var form = document.getElementById('contact-form');
        var btn = document.getElementById('submit-btn');
        var successMsg = document.getElementById('success-msg');
        var errorMsg = document.getElementById('error-msg');
        var messageEl = document.getElementById('message');
        var charCurrent = document.getElementById('char-current');

        messageEl.addEventListener('input', function() {
            var len = this.value.length;
            charCurrent.textContent = len.toLocaleString();
            var counter = this.nextElementSibling;
            counter.className = 'char-count' + (len >= 5000 ? ' at-limit' : len >= 4500 ? ' near-limit' : '');
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Sending...';

            var data = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value.trim(),
                website: document.getElementById('website').value
            };

            fetch('https://api.govtrove.com/api/contact/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(function(res) {
                if (!res.ok) {
                    return res.text().then(function(t) { throw new Error(t || 'Something went wrong'); });
                }
                form.style.display = 'none';
                successMsg.style.display = 'block';
            })
            .catch(function(err) {
                errorMsg.textContent = err.message || 'Failed to send message. Please try again.';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Send Message';
            });
        });
    </script>
</body>
</html>
