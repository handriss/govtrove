services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opscout
      POSTGRES_USER: opscout
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opscout -d opscout"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
