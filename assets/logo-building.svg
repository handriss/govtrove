<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" rx="48" fill="#0f172a"/>
  <!-- Capitol building -->
  <!-- Base/steps -->
  <rect x="75" y="175" width="150" height="10" rx="2" fill="#3b82f6"/>
  <!-- Pillars -->
  <rect x="90" y="130" width="12" height="45" rx="2" fill="#3b82f6"/>
  <rect x="114" y="130" width="12" height="45" rx="2" fill="#3b82f6"/>
  <rect x="144" y="130" width="12" height="45" rx="2" fill="#3b82f6"/>
  <rect x="174" y="130" width="12" height="45" rx="2" fill="#3b82f6"/>
  <rect x="198" y="130" width="12" height="45" rx="2" fill="#3b82f6"/>
  <!-- Roof beam -->
  <rect x="82" y="124" width="136" height="8" rx="2" fill="#3b82f6"/>
  <!-- Triangular pediment -->
  <polygon points="80,124 150,80 220,124" fill="#0f172a" stroke="#3b82f6" stroke-width="7" stroke-linejoin="round"/>
  <!-- Dome -->
  <path d="M130,80 Q130,55 150,50 Q170,55 170,80" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
  <!-- Magnifying glass -->
  <circle cx="200" cy="215" r="28" fill="#0f172a" stroke="#60a5fa" stroke-width="10"/>
  <line x1="220" y1="235" x2="250" y2="260" stroke="#60a5fa" stroke-width="10" stroke-linecap="round"/>
</svg>
