<!DOCTYPE html>

<tr>
<td align="center" style="padding:40px 20px;">

<tr>
<td>

{{.Summary}}

</tr>
</table>
</td>
</tr>

<p style="margin:0 0 4px 0;font-size:12px;">
<a href="{{.UnsubscribeURL}}" target="_blank" style="color:#6b7280;text-decoration:underline;">Unsubscribe from all emails</a>
</p>
<p style="margin:0;font-size:12px;">
<a href="https://govtrove.com" target="_blank" style="color:#6b7280;text-decoration:none;">govtrove.com</a>

</tr>

</table>
</td>
</tr>
