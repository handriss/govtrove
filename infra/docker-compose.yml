services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: govtrove
      POSTGRES_USER: govtrove
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govtrove -d govtrove"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - TZ=America/New_York
      - N8N_SECURE_COOKIE=false
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - N8N_CODE_NODE_ALLOW_FS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/output:/home/node/output

volumes:
  postgres_data:
  n8n_data:
